<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .student-info {
            background: #f1f3ff;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            color: #444;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .error {
            color: #e63946;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5369d8;
        }

        #successMessage {
            display: none;
            text-align: center;
            color: #16803c;
            background: #e7f8ed;
            padding: 12px;
            border-radius: 7px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Registration Form</h1>

        <p class="subtitle">
            College Admission Portal
        </p>

        <div class="student-info">
            <strong>Student Name:</strong>Harshita Bawane
            <br>
            <strong>USN:</strong> CD25014
        </div>

        <form id="registrationForm">

            <!-- Name -->
            <div class="form-group">
                <label for="name">Full Name *</label>

                <input
                    type="text"
                    id="name"
                    value="Harshita Bawane"
                    placeholder="Enter your full name">

                <span class="error" id="nameError"></span>
            </div>

            <!-- USN -->
            <div class="form-group">
                <label for="usn">USN *</label>

                <input
                    type="text"
                    id="usn"
                    value="CD25014"
                    placeholder="Enter your USN">

                <span class="error" id="usnError"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address *</label>

                <input
                    type="text"
                    id="email"
                    placeholder="example@email.com">

                <span class="error" id="emailError"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password *</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters">

                <span class="error" id="passwordError"></span>
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label for="mobile">Mobile Number *</label>

                <input
                    type="text"
                    id="mobile"
                    placeholder="Enter 10-digit mobile number">

                <span class="error" id="mobileError"></span>
            </div>

            <!-- Course -->
            <div class="form-group">
                <label for="course">Select Course *</label>

                <select id="course">

                    <option value="">
                        -- Select Course --
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Information Technology">
                        Information Technology
                    </option>

                    <option value="Artificial Intelligence and Machine Learning">
                        Artificial Intelligence & Machine Learning (AIML)
                    </option>

                    <option value="Data Science">
                        Data Science (DS)
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Mechanical">
                        Mechanical
                    </option>

                    <option value="Civil">
                        Civil
                    </option>

                </select>

                <span class="error" id="courseError"></span>
            </div>

            <!-- Submit -->
            <button type="submit">
                Submit Registration
            </button>

            <div id="successMessage">
                Registration submitted successfully!
            </div>

        </form>

    </div>


    <script>

        // Form submit event
        document
            .getElementById("registrationForm")
            .addEventListener("submit", function (event) {

                // Prevent actual form submission
                event.preventDefault();

                // Get values
                let name =
                    document.getElementById("name").value.trim();

                let usn =
                    document.getElementById("usn").value.trim();

                let email =
                    document.getElementById("email").value.trim();

                let password =
                    document.getElementById("password").value;

                let mobile =
                    document.getElementById("mobile").value.trim();

                let course =
                    document.getElementById("course").value;


                // Error elements
                let nameError =
                    document.getElementById("nameError");

                let usnError =
                    document.getElementById("usnError");

                let emailError =
                    document.getElementById("emailError");

                let passwordError =
                    document.getElementById("passwordError");

                let mobileError =
                    document.getElementById("mobileError");

                let courseError =
                    document.getElementById("courseError");


                // Clear previous errors
                nameError.textContent = "";
                usnError.textContent = "";
                emailError.textContent = "";
                passwordError.textContent = "";
                mobileError.textContent = "";
                courseError.textContent = "";

                document.getElementById(
                    "successMessage"
                ).style.display = "none";


                let isValid = true;


                // -------------------------
                // NAME VALIDATION
                // -------------------------

                if (name === "") {

                    nameError.textContent =
                        "Full name is required.";

                    isValid = false;

                } else if (!/^[A-Za-z ]+$/.test(name)) {

                    nameError.textContent =
                        "Name should contain only letters.";

                    isValid = false;
                }


                // -------------------------
                // USN VALIDATION
                // -------------------------

                if (usn === "") {

                    usnError.textContent =
                        "USN is required.";

                    isValid = false;

                }


                // -------------------------
                // EMAIL VALIDATION
                // -------------------------

                let emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (email === "") {

                    emailError.textContent =
                        "Email is required.";

                    isValid = false;

                } else if (!emailPattern.test(email)) {

                    emailError.textContent =
                        "Enter a valid email address.";

                    isValid = false;
                }


                // -------------------------
                // PASSWORD VALIDATION
                // -------------------------

                if (password === "") {

                    passwordError.textContent =
                        "Password is required.";

                    isValid = false;

                } else if (password.length < 8) {

                    passwordError.textContent =
                        "Password must contain at least 8 characters.";

                    isValid = false;
                }


                // -------------------------
                // MOBILE VALIDATION
                // -------------------------

                let mobilePattern =
                    /^[0-9]{10}$/;

                if (mobile === "") {

                    mobileError.textContent =
                        "Mobile number is required.";

                    isValid = false;

                } else if (!mobilePattern.test(mobile)) {

                    mobileError.textContent =
                        "Mobile number must contain exactly 10 digits.";

                    isValid = false;
                }


                // -------------------------
                // COURSE VALIDATION
                // -------------------------

                if (course === "") {

                    courseError.textContent =
                        "Please select a course.";

                    isValid = false;
                }


                // -------------------------
                // FINAL RESULT
                // -------------------------

                if (isValid) {

                    document.getElementById(
                        "successMessage"
                    ).style.display = "block";

                }

            });

    </script>

</body>

</html>
