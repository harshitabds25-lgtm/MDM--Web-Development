<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-purple-600 text-white text-center p-6">
    <h1 class="text-3xl font-bold">Student Notes App</h1>
    <p>Simple study note manager</p>
  </header>

  <main class="max-w-3xl mx-auto p-6">
    <div class="bg-white p-6 rounded-xl shadow">
      <input id="title" type="text" placeholder="Note title"
        class="w-full border rounded px-3 py-2 mb-3">

      <textarea id="note" placeholder="Write your note..."
        class="w-full border rounded px-3 py-2 h-32"></textarea>

      <button onclick="addNote()"
        class="mt-3 bg-purple-600 text-white px-5 py-2 rounded">
        Add Note
      </button>
    </div>

    <div id="notes" class="mt-6 grid gap-4 md:grid-cols-2"></div>
  </main>

  <script>
    function addNote() {
      const title = document.getElementById("title").value.trim();
      const note = document.getElementById("note").value.trim();

      if (!title || !note) {
        alert("Please enter both title and note.");
        return;
      }

      const card = document.createElement("div");
      card.className = "bg-white p-5 rounded-xl shadow";

      card.innerHTML = `
        <h2 class="text-xl font-bold">${title}</h2>
        <p class="mt-2 text-gray-600">${note}</p>
        <button onclick="this.parentElement.remove()"
          class="mt-4 bg-red-500 text-white px-3 py-1 rounded">Delete</button>
      `;

      document.getElementById("notes").appendChild(card);
      document.getElementById("title").value = "";
      document.getElementById("note").value = "";
    }
  </script>
</body>
</html>
